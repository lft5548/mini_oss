# Mini-OSS Docker runtime config

[server]
port = 8080
threads = 4
slow_request_ms = 200
max_request_bytes = 10485760
max_upload_bytes = 134217728
stream_upload_threshold_bytes = 1048576
max_connections = 1024
thread_queue_limit = 1024
request_timeout_ms = 5000
upload_timeout_ms = 30000

[storage]
dir = /data/storage

[logging]
dir = /data/logs
queue_limit = 8192

[auth]
# Demo token for local Docker runs. Override by mounting a custom config in real deployments.
token = dev-token

[redis]
enabled = true
host = redis
port = 6379
password =
db = 0
key_prefix = mini_oss
ttl_seconds = 300
connect_timeout_ms = 100
io_timeout_ms = 100
