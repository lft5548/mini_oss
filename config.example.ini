# Mini-OSS example config

[server]
port = 8080
threads = 4
slow_request_ms = 200
max_request_bytes = 10485760
max_upload_bytes = 134217728
stream_upload_threshold_bytes = 1048576
max_connections = 1024
thread_queue_limit = 1024
request_timeout_ms = 5000
upload_timeout_ms = 30000

[storage]
dir = storage

[logging]
dir = logs
queue_limit = 8192

[auth]
# Empty token disables authentication. Set a non-empty token to protect object APIs.
token =

[redis]
# Redis is an optional metadata cache. SQLite remains the source of truth.
enabled = false
host = 127.0.0.1
port = 6379
password =
db = 0
key_prefix = mini_oss
ttl_seconds = 300
connect_timeout_ms = 100
io_timeout_ms = 100
