# Mini-OSS example config

[server]
port = 8080
threads = 4
slow_request_ms = 200
max_request_bytes = 10485760
max_upload_bytes = 134217728
stream_upload_threshold_bytes = 1048576

[storage]
dir = storage

[logging]
dir = logs

[auth]
# Empty token disables authentication. Set a non-empty token to protect object APIs.
token =
