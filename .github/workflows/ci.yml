name: mini-oss-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libsqlite3-dev libhiredis-dev redis-server redis-tools python3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: ./scripts/smoke_test_http.py

      - name: Redis cache smoke test
        run: |
          redis-server --daemonize yes
          ./scripts/smoke_test_redis_cache.py
